[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "frontend", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is a soft target here (long prompts/URLs); not worth the churn
    "B008", # FastAPI's Depends()/Header() defaults rely on call-in-default-arg
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
"evals/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning",
]
